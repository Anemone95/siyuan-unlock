name: Prepare personal build source
description: Snapshot the current fork into an isolated build directory
inputs:
  version:
    required: true
    description: Source package version
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare source snapshot
      shell: bash
      env:
        BUILD_VERSION: ${{ inputs.version }}
      run: |
        python siyuan-note/scripts/prepare-personal-build.py \
          --source siyuan-note --destination siyuan-note/siyuan --version "$BUILD_VERSION"
        mkdir -p go
