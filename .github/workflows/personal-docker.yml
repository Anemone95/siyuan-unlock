name: Personal docker build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      unlock_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: siyuan-note

          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./siyuan-note/.github/actions/prepare-personal-build
        with:
          version: ${{ inputs.version }}
          unlock_ref: ${{ inputs.unlock_ref }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify account-free sync
        shell: bash
        working-directory: ${{ github.workspace }}/siyuan-note
        run: bash ../unlock-patches/scripts/check-account-free.sh siyuan

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Docker image
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --push --platform linux/amd64,linux/arm64,linux/arm/v7 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image:$RELEASE_TAG" .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Save build inputs
        uses: actions/upload-artifact@v4
        with:
          name: inputs-docker
          path: siyuan-note/siyuan-build-inputs.json
          if-no-files-found: warn
        if: always()
permissions:
  contents: read
  packages: write
